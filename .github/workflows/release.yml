name: Build and Release

on:
  push:
    # branches: [ main ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # pull_request:
  #   branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true' # Полностью скрывает предупреждения об устаревании Node.js 20
  HOMEBREW_NO_AUTO_UPDATE: '1'                    # Скрывает предупреждения brew и ускоряет запуск шага macOS
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. СБОРКА И УПАКОВКА ПОД LINUX (PORTABLE ZIP)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev zip

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Package Portable ZIP
        run: |
          mkdir RCC-Linux
          cp build/RCC RCC-Linux/
          zip -r RCC-Linux.zip RCC-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-Linux
          path: RCC-Linux.zip

  # ==========================================
  # 2. СБОРКА НАТИВНОГО ПАКЕТА ДЛЯ ARCH LINUX
  # ==========================================
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm base-devel cmake qt6-base qt6-multimedia imagemagick git sudo

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch and Run setup_arch_package.sh
        run: |
          # Создаем изолированного пользователя builder для makepkg
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

          # Отключаем установку пакета (-i) и копируем ТОЛЬКО основной пакет (без debug) в корень перед очисткой
          sed -i 's/makepkg -si/makepkg -s/g' setup_arch_package.sh
          sed -i 's/cd .. \&\& rm -rf rcc_pkg/cp rcc-[0-9]*.pkg.tar.zst ..\/RCC.pkg.tar.zst \&\& cd .. \&\& rm -rf rcc_pkg/g' setup_arch_package.sh

          # Запуск сборки от пользователя builder
          su builder -c "bash setup_arch_package.sh"

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-ArchLinux
          path: RCC.pkg.tar.zst

  # ==========================================
  # 3. СТАТИЧЕСКАЯ СБОРКА ПОД WINDOWS (PORTABLE ZIP)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Static Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-qt6-static
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-double-conversion
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-vulkan-headers

      - name: Configure and Build
        run: |
          cmake -S . -B build-windows -G "MinGW Makefiles"
          cmake --build build-windows -j2

      - name: Package Windows ZIP (PowerShell)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\RCC-Windows
          Copy-Item -Path .\build-windows\RCC.exe -Destination .\RCC-Windows\
          Compress-Archive -Path .\RCC-Windows -DestinationPath .\RCC-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-Windows
          path: RCC-Windows.zip

  # ==========================================
  # 4. СБОРКА ПОД MACOS (PORTABLE & INSTALLER)
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Configure and Build (Universal Binary)
        run: |
          # Собираем универсальный бинарник (x86_64 + arm64) с поддержкой систем от macOS 12.0
          cmake -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="12.0"
          cmake --build build-macos -j$(sysctl -n hw.ncpu)

      - name: Deploy dependencies into App Bundle
        run: |
          macdeployqt "build-macos/Royal Card Club.app"

      - name: Create Drag-and-Drop Installer DMG
        run: |
          brew install create-dmg
          mkdir dmg_root
          cp -R "build-macos/Royal Card Club.app" dmg_root/

          create-dmg \
            --volname "RCC Installer" \
            --window-pos 200 120 \
            --window-size 600 450 \
            --icon-size 100 \
            --icon "Royal Card Club.app" 150 150 \
            --hide-extension "Royal Card Club.app" \
            --app-drop-link 450 150 \
            RCC.dmg \
            dmg_root/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-macOS
          path: RCC.dmg

  # ==========================================
  # 5. СБОРКА ПОД IOS (IPA)
  # ==========================================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 Host (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Install Qt6 for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'ios'
          modules: 'qtmultimedia'

      - name: Configure and Build IPA
        run: |
          QT_HOST_DIR=$(find "$RUNNER_WORKSPACE/Qt" -type d -name "macos" | head -n 1)
          QT_IOS_DIR=$(find "$RUNNER_WORKSPACE/Qt" -type d -name "ios" | head -n 1)

          cmake -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$QT_IOS_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_DIR" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0

          cd build-ios
          xcodebuild -target RCC -configuration Release -sdk iphoneos \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          mkdir -p ipa_root/Payload
          cp -R Release-iphoneos/*.app ipa_root/Payload/

          # Нарезаем точные размеры иконок под iPhone и iPad
          APP_DIR=$(find ipa_root/Payload -name "*.app" | head -n 1)
          sips -z 180 180 ../assets/icon.png --out "$APP_DIR/AppIcon60x60@3x.png"
          sips -z 120 120 ../assets/icon.png --out "$APP_DIR/AppIcon60x60@2x.png"
          sips -z 152 152 ../assets/icon.png --out "$APP_DIR/AppIcon76x76@2x~ipad.png"

          cd ipa_root
          zip -qr ../RCC.ipa Payload
          cd ..
          rm -rf ipa_root

          cd ..
          cp build-ios/RCC.ipa .

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-iOS
          path: RCC.ipa

  # ==========================================
  # 6. СБОРКА ПОД ANDROID (APK)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Prepare Android Resources
        run: |
          mkdir -p assets/android/res/drawable
          cp assets/icon.png assets/android/res/drawable/icon.png

      - name: Install Qt6 for Android (ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia'

      - name: Configure and Build APK
        run: |
          QT_ANDROID_DIR=$(find "$RUNNER_WORKSPACE/Qt" -maxdepth 3 -type d -name "android_arm64_v8a" | head -n 1)

          "$QT_ANDROID_DIR/bin/qt-cmake" -B build-android -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

          cmake --build build-android

          keytool -genkey -v -keystore release.keystore -alias rcc_key -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=RoyalCardClub,O=Arta48,C=RU"

          RAW_APK=$(find build-android -name "*.apk" | head -n 1)
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n 1)

          "$APKSIGNER" sign --ks release.keystore --ks-pass pass:android --ks-key-alias rcc_key --key-pass pass:android --out RCC.apk "$RAW_APK"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-Android
          path: RCC.apk

  # ==========================================
  # 7. АВТОМАТИЧЕСКАЯ ПУБЛИКАЦИЯ РЕЛИЗА
  # ==========================================
  publish-release:
    needs: [build-linux, build-arch, build-windows, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # Срабатывает на любой числовой тег
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-Linux

      - name: Download Arch Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-ArchLinux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-Windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-macOS

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-iOS

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-Android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RCC-Linux.zip
            RCC.pkg.tar.zst
            RCC-Windows.zip
            RCC.dmg
            RCC.ipa
            RCC.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
