name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. LINUX (PORTABLE ZIP)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev zip

      - name: Run compile.sh
        run: bash compile.sh

      - name: Package Portable ZIP
        run: |
          mkdir RCC-Linux
          cp build/RCC RCC-Linux/
          zip -r RCC-Linux.zip RCC-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-Linux
          path: RCC-Linux.zip

  # ==========================================
  # 2. ARCH LINUX (PKG.TAR.ZST)
  # ==========================================
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm base-devel cmake qt6-base qt6-multimedia imagemagick git sudo

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch and Run setup_arch_package.sh
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

          # На CI отключаем установку (-i) и забираем собранный архив пакета
          sed -i 's|makepkg -si|makepkg -s|g' setup_arch_package.sh
          sed -i 's|cd .. \&\& rm -rf rcc_pkg|cp rcc-[0-9]*.pkg.tar.zst ..\/RCC.pkg.tar.zst \&\& cd .. \&\& rm -rf rcc_pkg|g' setup_arch_package.sh

          su builder -c "bash setup_arch_package.sh"

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-ArchLinux
          path: RCC.pkg.tar.zst

  # ==========================================
  # 3. WINDOWS (STATIC ZIP)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Static Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-qt6-static
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-double-conversion
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-vulkan-headers

      - name: Run compile_windows.sh
        run: bash compile_windows.sh

      - name: Package Windows ZIP (PowerShell)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\RCC-Windows
          Copy-Item -Path .\build-windows\RCC.exe -Destination .\RCC-Windows\
          Compress-Archive -Path .\RCC-Windows -DestinationPath .\RCC-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-Windows
          path: RCC-Windows.zip

  # ==========================================
  # 4. MACOS (DMG)
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 & create-dmg
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Run compile_macos.sh
        run: bash compile_macos.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-macOS
          path: RCC.dmg

  # ==========================================
  # 5. IOS (IPA)
  # ==========================================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 Host (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Install Qt6 for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'ios'
          modules: 'qtmultimedia'

      - name: Run compile_ios.sh
        run: bash compile_ios.sh

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-iOS
          path: RCC.ipa

  # ==========================================
  # 6. ANDROID (SIGNED APK)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Qt6 for Android (ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia'

      - name: Run compile_android.sh
        run: bash compile_android.sh

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCC-Android
          path: RCC.apk

  # ==========================================
  # 7. PUBLISH RELEASE
  # ==========================================
  publish-release:
    needs: [build-linux, build-arch, build-windows, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # Срабатывает на любой числовой тег
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-Linux

      - name: Download Arch Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-ArchLinux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-Windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-macOS

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-iOS

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: RCC-Android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RCC-Linux.zip
            RCC.pkg.tar.zst
            RCC-Windows.zip
            RCC.dmg
            RCC.ipa
            RCC.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
